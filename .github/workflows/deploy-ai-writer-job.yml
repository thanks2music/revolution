name: Deploy AI Writer Job

# 定期実行の Cloud Run Job (記事のパイプラインを CLI と同じ経路で動かす) の定義を更新する。
# 実行はしない (起動は Cloud Scheduler か手動)。
#
# Service の deploy (deploy-ai-writer.yml) とは分けている:
# - Job だけに要る手順 (private の templates の取得など) が失敗しても、Service の deploy を止めない
# - templates (プロンプト) だけを直した時に、Service を deploy し直さずに Job へ反映できる (workflow_dispatch)
#
# ⚠️ workflow_run は workflow の name で一致させる。deploy-ai-writer.yml の `name:` を変えると、
#   Service の deploy の後に Job が更新されなくなる。
# ⚠️ workflow_run は default branch の workflow しか動かない。この workflow の変更は main へ入ってから効く。
on:
  workflow_run:
    workflows:
      - Deploy AI Writer to Cloud Run
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# 同時に 2 本が Job を更新しないようにする (後から来た方を待たせる)
concurrency:
  group: deploy-ai-writer-job
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GAR_REPOSITORY }}

jobs:
  deploy-job:
    name: Deploy the scheduled job
    # Service の deploy が成功した時か、main からの手動実行の時だけ (ブランチから動かすと、そのコードが本番の Job になる)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run では、Service に deploy された commit と同じものを使う
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check required variables
        env:
          AI_WRITER_RUNTIME_SERVICE_ACCOUNT: ${{ vars.AI_WRITER_RUNTIME_SERVICE_ACCOUNT }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          SLACK_CHANNEL_PROD: ${{ vars.SLACK_CHANNEL_PROD }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          missing=0
          for key in AI_WRITER_RUNTIME_SERVICE_ACCOUNT ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID \
            ANTHROPIC_SERVICE_ACCOUNT_ID SLACK_CHANNEL_PROD R2_BUCKET_NAME R2_PUBLIC_URL; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing variable::$key is empty or unset."
              missing=1
            fi
          done
          exit "$missing"

      # 記事のテンプレート (YAML) は private のリポジトリにある。読み取り専用の deploy key で取得する
      - name: Checkout templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/revolution-templates
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
          path: .templates-src
          persist-credentials: false

      # scripts/sync-templates.sh と同じ物を同じ場所へ置く (あちらは手元の .env.local を読むので CI では使えない)。
      # どの版のテンプレートが入ったかを VERSION.json とイメージのタグに残す
      - name: Place templates for the job image
        id: templates
        env:
          SRC: .templates-src/ai-writer
          DEST: apps/ai-writer/templates
        run: |
          mkdir -p "$DEST/config"
          rsync -a --delete "$SRC/posts/yaml/collabo-cafe/" "$DEST/collabo-cafe/"
          cp "$SRC"/config/*.yaml "$DEST/config/"
          COMMIT=$(git -C .templates-src rev-parse HEAD)
          BRANCH=$(git -C .templates-src rev-parse --abbrev-ref HEAD)
          jq -n --arg commit "$COMMIT" --arg branch "$BRANCH" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{lastSynced: $at, sourceBranch: $branch, sourceCommit: $commit, sourceCommitShort: $commit[0:7], syncedBy: "github-actions"}' \
            > "$DEST/VERSION.json"
          rm -rf .templates-src
          echo "short=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "templates: ${BRANCH} ${COMMIT:0:7}, $(find "$DEST" -name '*.yaml' | wc -l) YAML files"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # タグは「revolution の commit + templates の commit」。同じ revolution の commit でも、
      # templates が違えば別のタグになる (後から版を突き合わせられるように)
      - name: Build and push the job image
        id: image
        env:
          REV_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TPL_SHORT: ${{ steps.templates.outputs.short }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}-job:${REV_SHA}-tpl-${TPL_SHORT}"
          docker build --target job --platform linux/amd64 -t "$IMAGE" -f apps/ai-writer/Dockerfile .
          docker push "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      # 環境変数は Service と同じものに、Slack の送り先と R2 を足す。値は variables と Secret Manager から読む
      - name: Deploy the job
        id: deploy
        run: |
          gcloud run jobs deploy ${{ env.SERVICE_NAME }}-job \
            --image "${{ steps.image.outputs.ref }}" \
            --region ${{ env.REGION }} \
            --service-account "${{ vars.AI_WRITER_RUNTIME_SERVICE_ACCOUNT }}" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 3600s \
            --memory 2Gi \
            --cpu 2 \
            --set-env-vars "NODE_ENV=production,AI_PROVIDER=google,VISION_API_PROVIDER=google,GITHUB_OWNER=${{ github.repository_owner }},GITHUB_REPO=${{ github.event.repository.name }},GITHUB_BASE_BRANCH=main,SENTRY_DSN=${{ vars.SENTRY_DSN_AI_WRITER }},SENTRY_ENVIRONMENT=production,ANTHROPIC_FEDERATION_RULE_ID=${{ vars.ANTHROPIC_FEDERATION_RULE_ID }},ANTHROPIC_ORGANIZATION_ID=${{ vars.ANTHROPIC_ORGANIZATION_ID }},ANTHROPIC_SERVICE_ACCOUNT_ID=${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }},ANTHROPIC_WORKSPACE_ID=${{ vars.ANTHROPIC_WORKSPACE_ID }},SLACK_CHANNEL_ID=${{ vars.SLACK_CHANNEL_PROD }},SLACK_MENTION_USER_ID=${{ vars.SLACK_MENTION_USER_ID }},R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }},R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}" \
            --set-secrets "GOOGLE_APPLICATION_CREDENTIALS_JSON=revo-firebase-service-account:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_PAT=GITHUB_PAT:latest,SLACK_BOT_TOKEN=SLACK_BOT_TOKEN:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_ENDPOINT_URL=R2_ENDPOINT_URL:latest"

      - name: Notify Slack of the result
        # 本番系へ 1 通。失敗の時だけメンションする。Job は更新されなければ以前の定義のまま
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_PROD }}
          # 本番の Job の更新なので、どこから動かしてもテストモードにしない
          auto-test-mode: 'false'
          mention: "${{ job.status != 'success' && vars.SLACK_MENTION_USER_ID || '' }}"
          text: "${{ job.status == 'success' && '✅ AI Writer: 定期実行の Job を更新しました' || (job.status == 'cancelled' && '⏹️ AI Writer: 定期実行の Job の更新が中断されました (Job は以前の定義のまま)' || '❌ AI Writer: 定期実行の Job を更新できませんでした (Job は以前の定義のまま)') }}"
          body: "*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}|${{ github.event.workflow_run.head_sha || github.sha }}> · *Templates*: ${{ steps.templates.outputs.short || '(取得前に止まった)' }} · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
