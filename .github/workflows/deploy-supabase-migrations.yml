name: Deploy Supabase Migrations

# Crescendolls 会員機能 (および将来の機能) の Supabase migration を staging / production に自動 deploy する。
#
# 設計方針 (本セッション 2026-06-10 BOSS 確定):
# - SSoT: drizzle (apps/frontend/drizzle/) を維持しつつ、Supabase CLI 形式 (timestamp prefix)
#   で apps/frontend/supabase/migrations/ にも配置 (初回手動コピー、将来は sync script)
# - 段階的 deploy: PR open → staging に migration、main merge → production に migration
# - GitHub Secrets は SUPABASE_ プレフィックス + PROD/STG で環境分離 (Vercel scope と異なり
#   GitHub Secrets は scope 機能なし)
# - Vercel-Supabase 順序保証は forward-only migration ルール + concurrency で担保
#   (詳細は docs/operations/supabase-migration-workflow.md)
#
# 公式テンプレ準拠: https://supabase.com/docs/guides/deployment/managing-environments

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/supabase/migrations/**'
      - '.github/workflows/deploy-supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/supabase/migrations/**'
      - '.github/workflows/deploy-supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '手動 deploy 先 (production / staging)'
        type: choice
        required: true
        default: staging
        options: [staging, production]

# 同一環境への同時 deploy を防ぐ。staging と production は別グループのため並行可。
concurrency:
  group: supabase-deploy-${{ github.event_name == 'push' && 'production' || github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || format('manual-{0}', inputs.target) }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # Backlog D β: α workflow の advisor-state artifact download 用 (Post-deploy advisor check step)
  # pull-requests: write は削除 (claude[bot] PR #256 review Finding #4 採用)。
  # 未実装機能への scope 予約は least privilege 違反 (GitHub Actions security hardening guide)。
  # PR コメント経路を実装する時点で追加する。

jobs:
  deploy-staging:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # supabase db push が hung した場合の concurrency lock 永久ホールド防止 (claude[bot] PR #244 review 採用)
    environment:
      name: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STG_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STG_PROJECT_ID }}
    steps:
      - name: Checkout repository
        # Revolution の ci.yml と整合させて v5 採用 (Node.js 24 ベース、track record 十分、
        # claude[bot] PR #244 review #2 採用)
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        # Action タグを specific pin (v2.1.1、2026-05-21 release) し、action level の
        # non-deterministic は解消 (claude[bot] PR #244 review #1 採用)。一方 Supabase CLI
        # 本体 (with: version) は latest 維持: PostgreSQL 17 など Postgres major version の
        # 追加に CLI が追従しないと `Failed reading config: Invalid db.major_version: 17` で
        # deploy が壊れるため (本 PR で実証)。CLI は前進する schema 互換性のために latest を
        # 採る公式 example の判断を踏襲。
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Link staging project
        working-directory: apps/frontend
        # env 経由で secret 値を渡す (公式 security best practice、
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build session pooler URL (mask + export to GITHUB_ENV)
        # Session pooler (port 5432) 経由で IPv4 接続する。GitHub Actions runner は
        # IPv4 のみ対応 (Supabase 公式: https://supabase.com/docs/guides/troubleshooting/supabase--your-network-ipv4-and-ipv6-compatibility-cHe3BP)、
        # direct DB host (db.<ref>.supabase.co) は Free プランで IPv6 限定のため
        # `supabase db push --linked` のデフォルト挙動 (direct 接続試行) では失敗する。
        # `--db-url` を明示すれば link 状態を bypass して確実に Supavisor 経由
        # (IPv4 互換) で接続できる。session mode (5432) は migration の advisory lock
        # に必要なため、transaction mode (6543) ではなく session mode を使う。
        # pooler host は keep-alive workflow と同一値 (両プロジェクト ap-northeast-1)。
        # password は URL-unsafe 記号を含み得るため jq で percent-encode する。
        # ::add-mask:: で URL 全体をログマスクし、エラー時の漏洩を防ぐ。
        # claude[bot] PR #250 review #4 (R2) 採用: 構築を 1 step に集約し
        # subsequent steps は $SESSION_POOLER_URL を env 経由で参照する。
        run: |
          set -euo pipefail

          # 自己レビュー #1 採用 (2026-06-27): set -u は unset のみ検知し、空文字
          # secret (DB_PASSWORD を誤って空文字で rotate した状態) は通してしまう。
          # jq @uri は空入力で空文字 + exit 0 を返すため、auth なしの URL が
          # silently 構築される。pre-flight の generic annotation が原因を誤誘導
          # するため、早期 explicit fail に倒す。
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_DB_PASSWORD is empty or unset. Pre-flight cannot run. Check GitHub Secrets (SUPABASE_STG_DB_PASSWORD / SUPABASE_PROD_DB_PASSWORD) and the secret rotation SoP (docs/operations/supabase-secret-rotation-sop.md)."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROJECT_REF is empty or unset. Check GitHub Secrets (SUPABASE_STG_PROJECT_ID / SUPABASE_PROD_PROJECT_ID)."
            exit 1
          fi

          PASSWORD_ENCODED=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PASSWORD_ENCODED"
          SESSION_POOLER_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASSWORD_ENCODED}@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$SESSION_POOLER_URL"
          echo "SESSION_POOLER_URL=$SESSION_POOLER_URL" >> "$GITHUB_ENV"

      - name: Pre-flight migration history consistency check
        working-directory: apps/frontend
        # PR #249 (titles master) 事故 (2026-06-21) の再発防止 (案 3 = CI 事前チェック)。
        # 同一 PR 内で migration ファイル名 (timestamp) を変更 + 旧 file 削除すると、
        # remote の migration_history と local files が乖離し `supabase db push` が
        # `Remote migration versions not found in local migrations directory.` で fail する。
        # `--dry-run` で実際の push 前に同じ整合性チェックを走らせ、失敗時には
        # repair SoP への明示誘導を行う (人間が原因と対処を即座に理解できるように)。
        # 公式仕様: https://github.com/supabase/cli `supabase db push --dry-run`
        # SoP: docs/operations/supabase-migration-workflow.md §10
        run: |
          set -euo pipefail

          # claude[bot] PR #250 review #3 (R2) 採用: --dry-run flag が現行 CLI に
          # 存在することを smoke-check する (version: latest の脆さ対策)。flag が
          # 消えた将来のために clear なエラーを出す (本 step が pre-flight として
          # 機能しなくなる前に止める)。
          if ! supabase db push --help 2>&1 | grep -q -- '--dry-run'; then
            echo "::error title=Pre-flight gate disabled::supabase CLI does not expose --dry-run flag. The pre-flight guard cannot run. Update this workflow (alternative: pin a compatible CLI version) or open an incident."
            exit 1
          fi

          # claude[bot] PR #250 review #2 (R2) 採用: error title を generic に
          # 統一 (--dry-run は connectivity / auth / pooler 不通でも fail するため、
          # 全部 "Migration history inconsistency" と annotate するのは誤誘導)。
          #
          # 自己レビュー #2 採用 (2026-06-27): Supabase Free プラン auto-pause
          # Resume 直後の transient pooler RST (Todoist `6gw7Pgr5FJCgqPFg` 由来の
          # 既知事象) で false-fail し、operator が §10 SoP に従って staging DB を
          # 不要に DROP するリスクがあるため、5 秒待機 + 1 度 retry を挟む。
          PREFLIGHT_OK=0
          for attempt in 1 2; do
            if supabase db push --db-url "$SESSION_POOLER_URL" --dry-run 2>&1; then
              PREFLIGHT_OK=1
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "::notice::Pre-flight attempt 1 failed; retrying after 5s (transient pooler RST after Supabase Free-plan auto-pause Resume is a known intermittent issue)."
              sleep 5
            fi
          done
          if [ "$PREFLIGHT_OK" = "0" ]; then
            echo ""
            echo "::error title=Migration pre-flight failed::Could not verify migration history after 2 attempts (5s gap). Possible causes: (a) migration_history inconsistency, (b) persistent connectivity / auth / pooler issue, (c) CLI breaking change. Read the CLI output above first to determine which."
            echo "::error::If (a) migration_history inconsistency: docs/operations/supabase-migration-workflow.md §10 (STAGING ONLY)."
            echo "::error::Hint: do NOT rename or delete a migration file that has already been deployed to a remote. Add a NEW migration to make further changes."
            echo "::error::If rollback is unavoidable: \`supabase migration repair --status reverted <version>\` after manually rolling back the DB objects (see SoP §10)."
            exit 1
          fi

          # 整合性 OK の場合: 現在の migration history を visibility のため表示
          echo "::group::Migration history (remote vs local)"
          supabase migration list --db-url "$SESSION_POOLER_URL" || true
          echo "::endgroup::"

      - name: Push migrations to staging
        working-directory: apps/frontend
        # 事前ビルド済の $SESSION_POOLER_URL を env から参照 (重複削減、claude[bot]
        # PR #250 review #4 (R2) 採用)。
        run: |
          set -euo pipefail
          supabase db push --db-url "$SESSION_POOLER_URL"

      - name: Post-deploy advisor check (Backlog D β, non-blocking)
        # Backlog D β: deploy 直後に Supabase Advisor を再取得し、α workflow の最新 artifact
        # (advisor-state-staging) を baseline として diff。新規 lint 発生 = 本 deploy が
        # 引き起こした regression → Slack Block Kit + `::warning::` annotation で即時通知。
        # non-blocking: advisor check 自体の失敗は deploy 成功を打ち消さない (`set +e` パターン)。
        # 詳細設計: Plan file §8.4、姉妹 workflow `supabase-advisor-check.yml` (α = 週次 cron)。
        # WEBHOOK 未登録環境 or baseline 未確立時は notice のみで skip (既存 deploy を止めない)。
        if: always()  # push step が fail しても実行 (deploy fail 起因の lint も検知したい)
        env:
          # workflow-level context を env: 経由に統一 (公式 security best practice: run: 内の
          # ${{ github.* }} 直接展開を避け injection 攻撃面を最小化。deploy-supabase-migrations.yml
          # の他 step とも整合)。
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SUPABASE_ADVISOR }}
          ENV_NAME: staging
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail  # -e は外す (advisor check 失敗を deploy 結果に影響させない)

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice title=Advisor check skipped::SLACK_WEBHOOK_SUPABASE_ADVISOR is not configured. Skipping post-deploy advisor check."
            exit 0
          fi

          # Supabase Management API 経由で advisors/security を取得
          HTTP_CODE=$(curl -sS -o post-deploy-advisor.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security" || echo "curl-failed")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning title=Post-deploy advisor fetch failed::HTTP ${HTTP_CODE} for ${ENV_NAME}. Deploy succeeded but advisor snapshot could not be captured."
            exit 0
          fi

          # 現在 lint を key 化 + count (α workflow と同じ形式)
          jq '{ lints_by_key: (.lints // [] | map({key: .cache_key, level, name, detail, remediation}) | INDEX(.key)), count: (.lints // [] | length) }' \
            post-deploy-advisor.json > post-deploy-state.json
          POST_COUNT=$(jq -r '.count' post-deploy-state.json)
          echo "Post-deploy advisor lint count on ${ENV_NAME}: ${POST_COUNT}"

          # α workflow の最新 artifact (advisor-state-${ENV_NAME}) を baseline として取得
          ARTIFACT_ID=$(gh api "/repos/${GH_REPO}/actions/artifacts?name=advisor-state-${ENV_NAME}&per_page=1" \
            --jq '.artifacts[0].id // empty' 2>/dev/null || echo "")

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::notice title=Advisor baseline unavailable::No prior α artifact for ${ENV_NAME}. Skipping diff (baseline will be established after α workflow runs)."
            exit 0
          fi

          if ! gh api "/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > baseline.zip 2>/dev/null; then
            echo "::warning title=Advisor baseline download failed::Could not fetch artifact ${ARTIFACT_ID} on ${ENV_NAME}. Skipping diff."
            exit 0
          fi

          if ! unzip -q -o baseline.zip -d baseline/; then
            echo "::warning::baseline artifact unzip failed"
            exit 0
          fi

          if [ ! -f baseline/current-state.json ]; then
            echo "::notice::baseline artifact does not contain expected file. Skipping diff."
            exit 0
          fi

          jq -r '.lints_by_key | keys[]' baseline/current-state.json | sort > baseline-keys.txt
          jq -r '.lints_by_key | keys[]' post-deploy-state.json | sort > post-keys.txt
          comm -23 post-keys.txt baseline-keys.txt > new-post-keys.txt
          NEW_POST_COUNT=$(wc -l < new-post-keys.txt | tr -d ' ')
          echo "New lints introduced by this deploy: ${NEW_POST_COUNT}"

          if [ "${NEW_POST_COUNT}" = "0" ]; then
            echo "::notice title=No advisor regression::Deploy did not introduce new advisor lints on ${ENV_NAME}."
            exit 0
          fi

          # 新規 lint あり → warning annotation + Slack 通知
          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' new-post-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            post-deploy-state.json > new-post-lints.json

          echo "::warning title=Post-deploy advisor regression::Deploy introduced ${NEW_POST_COUNT} new lint(s) on ${ENV_NAME}. Check Slack for details."

          # Slack Block Kit (α と同 format、header は "Post-deploy regression" に差別化)
          NEW_SECTIONS=$(jq '[
            .[0:5] | .[] |
            {
              type: "section",
              text: {
                type: "mrkdwn",
                text: ("*🆕 New (post-deploy): `\(.name)` (" + .level + ")*\n" + (.detail // "(no detail)") + "\n<" + (.remediation // "https://supabase.com/docs/guides/database/database-linter") + "|Remediation>")
              }
            }
          ]' new-post-lints.json)

          RUN_URL="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          COMMIT_URL="${GH_SERVER_URL}/${GH_REPO}/commit/${GH_SHA}"
          # claude[bot] PR #256 review Finding #2 採用: bash double-quoted string 内の `\n` は
          # literal 2 文字。ANSI-C quoting `$'\n'` で実 newline (0x0A) を挿入し、Slack Block Kit
          # mrkdwn の line break として render させる。
          NL=$'\n'
          PR_LINK=""
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_LINK="${NL}*PR*: <${GH_SERVER_URL}/${GH_REPO}/pull/${PR_NUMBER}|#${PR_NUMBER}>"
          fi

          SUMMARY="*This deploy introduced ${NEW_POST_COUNT} new advisor lint(s) on ${ENV_NAME}.*${NL}*Env*: \`${ENV_NAME}\` (\`${SUPABASE_PROJECT_REF}\`)${NL}*Baseline*: α artifact (advisor-state-${ENV_NAME})${PR_LINK}"

          jq -n \
            --arg header "⚠️ Supabase Advisor Regression (post-deploy ${ENV_NAME})" \
            --arg summary "${SUMMARY}" \
            --arg run_link "<${RUN_URL}|Workflow run> · <${COMMIT_URL}|Commit>" \
            --argjson new_sections "${NEW_SECTIONS}" \
            '{
              blocks: (
                [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $summary } },
                  { type: "divider" }
                ]
                + $new_sections
                + [
                  { type: "divider" },
                  { type: "context", elements: [{ type: "mrkdwn", text: $run_link }] }
                ]
              )
            }' > slack-payload.json

          curl -sS -X POST -o /dev/null \
            -H 'Content-Type: application/json' \
            --data-binary @slack-payload.json \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notification failed (non-blocking)"

  deploy-production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # supabase db push が hung した場合の concurrency lock 永久ホールド防止 (claude[bot] PR #244 review 採用)
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
    steps:
      - name: Checkout repository
        # staging job と整合 (claude[bot] PR #244 review 採用)
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        # staging job と整合 (action は v2.1.1 pin / CLI は latest 維持、上の staging job
        # コメント参照)
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Link production project
        working-directory: apps/frontend
        # env 経由で secret 値を渡す (公式 security best practice)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build session pooler URL (mask + export to GITHUB_ENV)
        # staging job と同一のロジック。詳細コメントは staging job の同名 step を参照。
        # claude[bot] PR #250 review #4 (R2) 採用で per-job 1 step 集約。
        run: |
          set -euo pipefail

          # 自己レビュー #1 採用 (2026-06-27): set -u は unset のみ検知し、空文字
          # secret (DB_PASSWORD を誤って空文字で rotate した状態) は通してしまう。
          # jq @uri は空入力で空文字 + exit 0 を返すため、auth なしの URL が
          # silently 構築される。pre-flight の generic annotation が原因を誤誘導
          # するため、早期 explicit fail に倒す。
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_DB_PASSWORD is empty or unset. Pre-flight cannot run. Check GitHub Secrets (SUPABASE_STG_DB_PASSWORD / SUPABASE_PROD_DB_PASSWORD) and the secret rotation SoP (docs/operations/supabase-secret-rotation-sop.md)."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROJECT_REF is empty or unset. Check GitHub Secrets (SUPABASE_STG_PROJECT_ID / SUPABASE_PROD_PROJECT_ID)."
            exit 1
          fi

          PASSWORD_ENCODED=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PASSWORD_ENCODED"
          SESSION_POOLER_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASSWORD_ENCODED}@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$SESSION_POOLER_URL"
          echo "SESSION_POOLER_URL=$SESSION_POOLER_URL" >> "$GITHUB_ENV"

      - name: Pre-flight migration history consistency check
        working-directory: apps/frontend
        # staging job と同一の事前チェック。詳細コメントは staging job の同名 step を参照。
        # production 環境では fail = 即 critical (本番 deploy が想定外状態) のため
        # 確実な可視性が特に重要。
        #
        # ⚠️ 注意 (claude[bot] PR #250 review #2 + R2 #1 採用): production 側で本 step
        # が fail した場合の復旧 SoP は **現時点未策定** (本 PR は staging のみカバー)。
        # そのため annotation は §10 (staging-only SoP) を案内せず、**直接 escalation**
        # を要求する。万が一発生した時の暫定手順は: (a) Supabase dashboard で手動
        # inspect、(b) staging SoP (§10) を **そのまま適用せず、参考に留める**、
        # (c) ロールバック判断は BOSS 単独で行う。production repair SoP の策定は
        # §10.1 末尾の Out of scope に明示 (別タスク)。
        run: |
          set -euo pipefail

          # smoke-check (R2 #3 採用): staging と同一、--dry-run flag 存在確認
          if ! supabase db push --help 2>&1 | grep -q -- '--dry-run'; then
            echo "::error title=Pre-flight gate disabled (PRODUCTION)::supabase CLI does not expose --dry-run flag. The pre-flight guard cannot run. Escalate immediately and update this workflow."
            exit 1
          fi

          # claude[bot] PR #250 review R2 #1 採用: production の error annotation は
          # §10 (staging-only) を案内せず、**直接 escalation** を要求する。
          # 自己レビュー #2 採用: staging と同一 5s retry (transient pooler RST 対策)。
          PREFLIGHT_OK=0
          for attempt in 1 2; do
            if supabase db push --db-url "$SESSION_POOLER_URL" --dry-run 2>&1; then
              PREFLIGHT_OK=1
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "::notice::Pre-flight attempt 1 failed (PRODUCTION); retrying after 5s (transient pooler RST after Supabase Free-plan auto-pause Resume is a known intermittent issue)."
              sleep 5
            fi
          done
          if [ "$PREFLIGHT_OK" = "0" ]; then
            echo ""
            echo "::error title=Migration pre-flight failed (PRODUCTION — ESCALATE TO BOSS)::Could not verify migration history after 2 attempts (5s gap). Possible causes: (a) migration_history inconsistency, (b) persistent connectivity / auth / pooler issue, (c) CLI breaking change. Read the CLI output above first to determine which."
            echo "::error::PRODUCTION repair SoP does NOT exist yet. Do NOT follow §10 verbatim — it is STAGING-ONLY. See the inline comment in deploy-supabase-migrations.yml (this workflow file)."
            echo "::error::Escalate to BOSS immediately. Do NOT run \`supabase migration repair\` against production without explicit BOSS approval."
            exit 1
          fi

          echo "::group::Migration history (remote vs local)"
          supabase migration list --db-url "$SESSION_POOLER_URL" || true
          echo "::endgroup::"

      - name: Push migrations to production
        working-directory: apps/frontend
        # 事前ビルド済の $SESSION_POOLER_URL を env から参照 (重複削減、claude[bot]
        # PR #250 review #4 (R2) 採用)。詳細は staging job の同名 step コメントを参照。
        run: |
          set -euo pipefail
          supabase db push --db-url "$SESSION_POOLER_URL"

      - name: Post-deploy advisor check (Backlog D β, non-blocking)
        # Backlog D β の production 版。staging と同ロジック (baseline は α の
        # advisor-state-production artifact)、詳細コメントは staging job の同名 step を参照。
        # production 環境でも non-blocking (deploy 成功後の情報通知)。
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SUPABASE_ADVISOR }}
          ENV_NAME: production
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice title=Advisor check skipped::SLACK_WEBHOOK_SUPABASE_ADVISOR is not configured. Skipping post-deploy advisor check."
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o post-deploy-advisor.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security" || echo "curl-failed")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning title=Post-deploy advisor fetch failed::HTTP ${HTTP_CODE} for ${ENV_NAME}. Deploy succeeded but advisor snapshot could not be captured."
            exit 0
          fi

          jq '{ lints_by_key: (.lints // [] | map({key: .cache_key, level, name, detail, remediation}) | INDEX(.key)), count: (.lints // [] | length) }' \
            post-deploy-advisor.json > post-deploy-state.json
          POST_COUNT=$(jq -r '.count' post-deploy-state.json)
          echo "Post-deploy advisor lint count on ${ENV_NAME}: ${POST_COUNT}"

          ARTIFACT_ID=$(gh api "/repos/${GH_REPO}/actions/artifacts?name=advisor-state-${ENV_NAME}&per_page=1" \
            --jq '.artifacts[0].id // empty' 2>/dev/null || echo "")

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::notice title=Advisor baseline unavailable::No prior α artifact for ${ENV_NAME}. Skipping diff (baseline will be established after α workflow runs)."
            exit 0
          fi

          if ! gh api "/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > baseline.zip 2>/dev/null; then
            echo "::warning title=Advisor baseline download failed::Could not fetch artifact ${ARTIFACT_ID} on ${ENV_NAME}. Skipping diff."
            exit 0
          fi

          if ! unzip -q -o baseline.zip -d baseline/; then
            echo "::warning::baseline artifact unzip failed"
            exit 0
          fi

          if [ ! -f baseline/current-state.json ]; then
            echo "::notice::baseline artifact does not contain expected file. Skipping diff."
            exit 0
          fi

          jq -r '.lints_by_key | keys[]' baseline/current-state.json | sort > baseline-keys.txt
          jq -r '.lints_by_key | keys[]' post-deploy-state.json | sort > post-keys.txt
          comm -23 post-keys.txt baseline-keys.txt > new-post-keys.txt
          NEW_POST_COUNT=$(wc -l < new-post-keys.txt | tr -d ' ')
          echo "New lints introduced by this deploy: ${NEW_POST_COUNT}"

          if [ "${NEW_POST_COUNT}" = "0" ]; then
            echo "::notice title=No advisor regression::Deploy did not introduce new advisor lints on ${ENV_NAME}."
            exit 0
          fi

          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' new-post-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            post-deploy-state.json > new-post-lints.json

          echo "::warning title=Post-deploy advisor regression (PRODUCTION)::Deploy introduced ${NEW_POST_COUNT} new lint(s) on ${ENV_NAME}. Check Slack for details."

          NEW_SECTIONS=$(jq '[
            .[0:5] | .[] |
            {
              type: "section",
              text: {
                type: "mrkdwn",
                text: ("*🆕 New (post-deploy): `\(.name)` (" + .level + ")*\n" + (.detail // "(no detail)") + "\n<" + (.remediation // "https://supabase.com/docs/guides/database/database-linter") + "|Remediation>")
              }
            }
          ]' new-post-lints.json)

          RUN_URL="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          COMMIT_URL="${GH_SERVER_URL}/${GH_REPO}/commit/${GH_SHA}"
          # claude[bot] PR #256 review Finding #2 採用 (production 側も同修正)。
          NL=$'\n'
          PR_LINK=""
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_LINK="${NL}*PR*: <${GH_SERVER_URL}/${GH_REPO}/pull/${PR_NUMBER}|#${PR_NUMBER}>"
          fi

          SUMMARY="*This deploy introduced ${NEW_POST_COUNT} new advisor lint(s) on PRODUCTION.*${NL}*Env*: \`${ENV_NAME}\` (\`${SUPABASE_PROJECT_REF}\`)${NL}*Baseline*: α artifact (advisor-state-${ENV_NAME})${PR_LINK}"

          jq -n \
            --arg header "🔴 Supabase Advisor Regression (post-deploy PRODUCTION)" \
            --arg summary "${SUMMARY}" \
            --arg run_link "<${RUN_URL}|Workflow run> · <${COMMIT_URL}|Commit>" \
            --argjson new_sections "${NEW_SECTIONS}" \
            '{
              blocks: (
                [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $summary } },
                  { type: "divider" }
                ]
                + $new_sections
                + [
                  { type: "divider" },
                  { type: "context", elements: [{ type: "mrkdwn", text: $run_link }] }
                ]
              )
            }' > slack-payload.json

          curl -sS -X POST -o /dev/null \
            -H 'Content-Type: application/json' \
            --data-binary @slack-payload.json \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notification failed (non-blocking)"
