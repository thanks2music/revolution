name: Supabase Keep-Alive

# Supabase Free プランは「7 日間以上 十分なアクティビティがない」プロジェクトを自動 pause する。
# 本ワークフローは毎日 1 回 PostgREST API へ軽量 HTTP リクエストを投げてアクティビティを発生させ、
# 自動 pause を防ぐ (Revolution の production + staging 両 project)。
#
# 背景・方針の詳細: Todoist 6gw7Pgr5FJCgqPFg / SSoT task-priority-mapping.md 第 33 回エントリ /
# 運用 SoP: docs/operations/supabase-secret-rotation-sop.md。
# 実ユーザー獲得後は Pro プラン昇格 (org 単位で pause 無効) で本ワークフローは不要になる。
#
# === 2026-07-05 大幅改修: pooler SELECT 1 は activity として counted されない (Backlog D で判明) ===
#
# 旧設計は `psql -Atc "select 1;"` を Session pooler (aws-1-ap-northeast-1.pooler.supabase.com:5432)
# 経由で実行していたが、以下の実証で「動作しているが Supabase の pause 判定に効果なし」と判定:
#
# - 2026-06-22 以降 48 runs 全 success (5-10 秒完了) にもかかわらず、
# - 2026-06-18/19/20/27 に BOSS Gmail に pause 警告メール 5 件到達
# - 7/1 の PR #251 マージ後 (実 migration deploy 発生) は警告停止 → deploy は activity として counted
#
# Supabase 公式仕様 (free-project-pausing.mdx):
#   "Generate a sufficient amount of activity by making API calls to your project
#    or sending requests via your connected application."
# 公式: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/platform/free-project-pausing.mdx
#
# → Session pooler の system role による internal DB 接続は "API calls to your project" ではない。
# → 修正: PostgREST API 経由の HTTP リクエスト (公式明記の "API calls") に置換。
#
# === 修正内容 (Backlog D 統合、2026-07-05) ===
#
#   1. psql via Session pooler → curl via PostgREST API (`GET /rest/v1/categories?select=id&limit=1`)
#   2. 認証: `apikey` + `Authorization: Bearer` header に Publishable key を使用 (旧 DB_PASSWORD 不要)
#      - 新規 GitHub Secrets: `SUPABASE_STG_PUBLISHABLE_KEY` / `SUPABASE_PROD_PUBLISHABLE_KEY`
#      - Publishable key は client-safe な新体系 API key (旧 anon key の後継、Supabase 2024 migration)
#      - PostgREST は Publishable key で anon role にマップ、categories 表への SELECT policy が適用される
#   3. 対象 endpoint: `https://<project_ref>.supabase.co/rest/v1/categories?select=id&limit=1`
#      - categories 表 = PR #247 で seed 済 (23 行)、RLS `categories_select_all` で anon read 可
#      - 実データを read することで PostgREST + DB + RLS すべてに activity 発生 (公式 activity 判定を確実にヒット)
#   4. Session pooler 経由の直接 DB 接続は本 workflow から撤廃 (activity 判定外のため無意味)
#   5. 旧 secret (`SUPABASE_{STG,PROD}_DB_PASSWORD`) は他 workflow (deploy-supabase-migrations.yml) で
#      引き続き使用されるため削除しない
#
# === 旧設計の教訓 ===
#
# - production + staging を 2 別 job で並列実行の設計 (片方失敗が他方を止めない) は継承
# - cron 時刻を 2 job で 5 分ずらし (root cause 切り分け容易化) は継承
# - workflow_dispatch input `target` (both / production / staging) は継承
# - keep-alive 用 secret を deploy と共有 (rotation 忘れリスク構造排除) は継承 (新 Publishable key も同構造)
#
# === IPv4 制約 ===
#
# GitHub Actions runner は IPv4 のみ、Supabase の REST API endpoint (`<ref>.supabase.co`) は
# IPv4/IPv6 dual stack のため直接接続可能 (pooler 迂回不要)。
#
# === 既知の制約 (workflow 発火) ===
#
# - schedule / workflow_dispatch イベントは「デフォルトブランチ (main) 上のワークフロー定義」
#   でのみ発火する (GitHub 公式仕様)。本ファイルが main にマージされるまで cron 実行・
#   手動実行ボタンは有効化されない。
# - public リポジトリの scheduled workflow は「60 日間リポジトリ活動が無い」と GitHub が
#   自動で無効化する (公式仕様)。長期休眠 (60 日以上コミット無し) に入ると本 keep-alive
#   も停止し、その後 Supabase が pause し得る。能動開発中は問題ないが、長期休眠を見込む
#   場合は Actions の再有効化、または外部 cron / Vercel Cron の併用を検討する。

on:
  schedule:
    # 毎日 1 回 (UTC 15:37 = JST 翌 00:37) ― production。7 日制限に対し大きなマージンを確保する。
    # 分 0 (top-of-hour) は GitHub Actions の負荷集中で遅延・スキップしやすいため分をずらす。
    - cron: "37 15 * * *"
    # staging は production の 5 分後 (UTC 15:42)。同時失敗時の root cause 切り分けを容易にする。
    - cron: "42 15 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "ping 対象 project (debug 用)"
        type: choice
        required: true
        default: both
        options:
          - both
          - production
          - staging

# 本 job 群は Supabase の外部 REST API へ接続するのみで、リポジトリ内容への書き込み・読み取りは不要。
# 最小権限の原則に従い GITHUB_TOKEN の権限を空にする。
permissions: {}

jobs:
  ping-production:
    name: Ping Supabase PostgREST (production)
    # workflow_dispatch 時は target で個別制御、schedule は cron で識別 (旧設計から継承)。
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'production'))
      || (github.event_name == 'schedule' && github.event.schedule == '37 15 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
      # 新体系 API key (client-safe Publishable key、Supabase 2024 migration)。
      # RLS 適用 anon role にマップされ、categories 表への SELECT policy を通過。
      # 旧 anon key (Legacy) ではなく sb_publishable_ prefix の新形式を採用。
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
      # 2 巡目 review Finding #3 採用: keep-alive の失敗 (Publishable key rotation 忘れ /
      # 503 pause) は GitHub default failed-workflow email に依存する passive 通知だった。
      # Advisor 監視 (Backlog D α+β) と同 webhook で active push 通知に統一する。
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SUPABASE_ADVISOR }}
      # workflow-level context (Slack 通知の run link 用、run: 内直接展開を避ける)
      GH_SERVER_URL: ${{ github.server_url }}
      GH_REPO: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - name: HTTP ping to PostgREST to keep production active
        run: |
          set -euo pipefail

          # secret 未設定の早期 fail (deploy-supabase-migrations.yml と同 pattern、
          # set -u は unset のみ検知し空文字は通してしまうため明示チェック)。
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROD_PROJECT_ID is empty or unset."
            exit 1
          fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROD_PUBLISHABLE_KEY is empty or unset. Add it via 'gh secret set SUPABASE_PROD_PUBLISHABLE_KEY' after copying from Supabase Dashboard > Settings > API Keys > Publishable key."
            exit 1
          fi

          # PostgREST API endpoint. categories 表を `?select=id&limit=1` で最小 payload read.
          # RLS `categories_select_all` policy が anon role に SELECT を許可済 (PR #247 で導入)。
          # 200 = success (activity registered); 4xx/5xx = failure.
          # `-w '%{http_code}'` で status のみ取得、-o /dev/null で body 破棄 (log noise 削減).
          # `-sS` = silent + show error, `--max-time 30` = network hang guard.
          HTTP_CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/categories?select=id&limit=1")

          # 2 巡目 review Finding #3 採用: 失敗経路で Slack 通知を送る (非 blocking)。
          # Slack 通知 curl 失敗が本 step の exit code に影響しないよう `|| echo` で吸収し、
          # 「本来の失敗理由」(503 or その他 HTTP error) で exit 1 する。
          # NL は ANSI-C quoting で real newline (0x0A)、Slack Block Kit mrkdwn の line break
          # として render される (Finding #2 と同 pattern、literal `\n` はダメ)。
          NL=$'\n'
          notify_slack_failure() {
            local title="$1"
            local detail="$2"
            if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
              return 0
            fi
            local run_url="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
            jq -n \
              --arg header "${title}" \
              --arg detail "${detail}" \
              --arg run_link "<${run_url}|Workflow run>" \
              '{
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $detail } },
                  { type: "divider" },
                  { type: "context", elements: [{ type: "mrkdwn", text: $run_link }] }
                ]
              }' > slack-payload.json
            curl -sS -X POST -o /dev/null \
              -H 'Content-Type: application/json' \
              --data-binary @slack-payload.json \
              "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notification failed (non-blocking)"
          }

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "Supabase keep-alive HTTP ping (production) succeeded: HTTP ${HTTP_CODE}"
          elif [ "${HTTP_CODE}" = "503" ]; then
            # 503 = project already paused. HTTP request itself acts as a wake-up trigger,
            # but auto-restore requires dashboard resume for Free plan (公式仕様).
            echo "::warning title=Project paused::HTTP ${HTTP_CODE} - production project is already paused. Resume it manually from the Supabase Dashboard."
            notify_slack_failure \
              "🔴 Supabase Keep-Alive: production is PAUSED" \
              "*HTTP 503* - production Supabase project (\`${SUPABASE_PROJECT_REF}\`) is already paused.${NL}Manual resume required from the Supabase Dashboard."
            exit 1
          else
            echo "::error title=Keep-alive HTTP ping failed::HTTP ${HTTP_CODE} on production. Check Publishable key rotation and categories RLS policy."
            notify_slack_failure \
              "🔴 Supabase Keep-Alive: production ping FAILED" \
              "*HTTP ${HTTP_CODE}* on production (\`${SUPABASE_PROJECT_REF}\`).${NL}Check Publishable key rotation and \`categories\` RLS policy."
            exit 1
          fi

  ping-staging:
    name: Ping Supabase PostgREST (staging)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'staging'))
      || (github.event_name == 'schedule' && github.event.schedule == '42 15 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STG_PROJECT_ID }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STG_PUBLISHABLE_KEY }}
      # 2 巡目 review Finding #3 採用 (staging 側も同修正)。詳細コメントは production job env を参照。
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SUPABASE_ADVISOR }}
      GH_SERVER_URL: ${{ github.server_url }}
      GH_REPO: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - name: HTTP ping to PostgREST to keep staging active
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_STG_PROJECT_ID is empty or unset."
            exit 1
          fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_STG_PUBLISHABLE_KEY is empty or unset. Add it via 'gh secret set SUPABASE_STG_PUBLISHABLE_KEY' after copying from Supabase Dashboard > Settings > API Keys > Publishable key."
            exit 1
          fi

          HTTP_CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/categories?select=id&limit=1")

          # 2 巡目 review Finding #3 採用 (staging 側も同修正)。詳細コメントは production job を参照。
          NL=$'\n'
          notify_slack_failure() {
            local title="$1"
            local detail="$2"
            if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
              return 0
            fi
            local run_url="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
            jq -n \
              --arg header "${title}" \
              --arg detail "${detail}" \
              --arg run_link "<${run_url}|Workflow run>" \
              '{
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $detail } },
                  { type: "divider" },
                  { type: "context", elements: [{ type: "mrkdwn", text: $run_link }] }
                ]
              }' > slack-payload.json
            curl -sS -X POST -o /dev/null \
              -H 'Content-Type: application/json' \
              --data-binary @slack-payload.json \
              "${SLACK_WEBHOOK_URL}" || echo "::warning::Slack notification failed (non-blocking)"
          }

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "Supabase keep-alive HTTP ping (staging) succeeded: HTTP ${HTTP_CODE}"
          elif [ "${HTTP_CODE}" = "503" ]; then
            echo "::warning title=Project paused::HTTP ${HTTP_CODE} - staging project is already paused. Resume it manually from the Supabase Dashboard."
            notify_slack_failure \
              "⚠️ Supabase Keep-Alive: staging is PAUSED" \
              "*HTTP 503* - staging Supabase project (\`${SUPABASE_PROJECT_REF}\`) is already paused.${NL}Manual resume required from the Supabase Dashboard."
            exit 1
          else
            echo "::error title=Keep-alive HTTP ping failed::HTTP ${HTTP_CODE} on staging. Check Publishable key rotation and categories RLS policy."
            notify_slack_failure \
              "⚠️ Supabase Keep-Alive: staging ping FAILED" \
              "*HTTP ${HTTP_CODE}* on staging (\`${SUPABASE_PROJECT_REF}\`).${NL}Check Publishable key rotation and \`categories\` RLS policy."
            exit 1
          fi
