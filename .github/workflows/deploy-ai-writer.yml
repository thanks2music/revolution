name: Deploy AI Writer to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ai-writer/**'
      - '.github/workflows/deploy-ai-writer.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GAR_REPOSITORY }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.SENTRY_DSN_AI_WRITER }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_RELEASE="${{ github.sha }}" \
            --platform linux/amd64 \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
            -f apps/ai-writer/Dockerfile \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --concurrency 80 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "NODE_ENV=production,GITHUB_OWNER=${{ github.repository_owner }},GITHUB_REPO=${{ github.event.repository.name }},GITHUB_BASE_BRANCH=main,SENTRY_DSN=${{ vars.SENTRY_DSN_AI_WRITER }},SENTRY_ENVIRONMENT=production" \
            --set-secrets "ALLOWED_EMAILS=revo-allowed-emails:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=revo-firebase-service-account:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_PAT=GITHUB_PAT:latest"

      - name: Health check
        id: health
        # cold start で最初の数十秒は応答が遅れることがある。1 回の失敗でメンション付きの通知を
        # 飛ばさないよう、15 秒おきに 8 回まで (最悪で約 3 分) 確かめる。
        # 先にトラフィックの割り当てを見る。以前のリビジョンに固定されていると (手動ロールバックの後など)、
        # 新しいリビジョンにトラフィックが流れず、サービスの URL への health check は以前のリビジョンの
        # 応答で通ってしまう (Cloud Run は固定された割り当てを以降のデプロイでも保つ)
        timeout-minutes: 4
        run: |
          SERVICE_JSON=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format json)
          SERVICE_URL=$(jq -r '.status.url' <<<"${SERVICE_JSON}")
          LATEST_PERCENT=$(jq '[.status.traffic[]? | select(.latestRevision == true) | (.percent // 0)] | add // 0' <<<"${SERVICE_JSON}")

          echo "Service URL: $SERVICE_URL"

          if [ "${LATEST_PERCENT}" != "100" ]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Traffic is pinned::The latest revision receives ${LATEST_PERCENT}% of traffic. Run update-traffic --to-latest after checking the new revision."
            exit 1
          fi

          # 接続できない / タイムアウトでも curl は 000 を出す
          tries=8
          for attempt in $(seq "${tries}"); do
            HEALTH_STATUS=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health") || true
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Health check attempt ${attempt}: HTTP ${HEALTH_STATUS}"
            if [ "${attempt}" -lt "${tries}" ]; then sleep 15; fi
          done
          echo "http_code=${HEALTH_STATUS}" >> "$GITHUB_OUTPUT"
          echo "❌ Health check failed with status: ${HEALTH_STATUS}"
          exit 1

      - name: Build the Slack message
        id: msg
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          HTTP_CODE: ${{ steps.health.outputs.http_code }}
          PINNED: ${{ steps.health.outputs.pinned }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/notify/deploy-result-message.sh

      - name: Notify Slack of the deployment result
        # 結果を本番系へ 1 通。文面・メンション・ロールバック手順は .github/scripts/notify/deploy-result-message.sh
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_PROD }}
          # 本番への実デプロイの結果なので、ブランチから dispatch されてもテストモードにしない
          auto-test-mode: 'false'
          mention: "${{ steps.msg.outputs.mention == 'true' && vars.SLACK_MENTION_USER_ID || '' }}"
          text: ${{ steps.msg.outputs.text }}
          body: ${{ steps.msg.outputs.body }}

      - name: Output deployment info
        run: |
          echo "🚀 Deployment completed!"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
