name: Supabase Advisor Check

# Backlog D (α): Supabase Weekly Security 警告メールの受動的な仕組みを、
# 能動的な GitHub Actions cron + Slack Block Kit 通知経路に置き換える。
#
# 起因: PR #251 (venues master + PostGIS) マージ後の Supabase Advisor 週次警告メールを
# BOSS が Gmail 手動 check で受け取って初めて気付いた問題 (PR #251 副産物 = PostGIS
# extension が public schema にインストール → spatial_ref_sys ERROR + 8 件 WARN 発生) を根本解消。
#
# 動作:
# 1. Supabase Management API `GET /v1/projects/{ref}/advisors/security` で
#    staging + production 両プロジェクトの security lints を取得
# 2. 前回実行結果 (Actions artifact `advisor-state-{env}`) と cache_key で diff 検知
# 3. 新規発生 lint / 解消 lint あれば Slack Block Kit で通知 (差分ゼロ時は noise 回避)
# 4. 現在の状態を artifact として保存 (次回実行の diff 元)
#
# 参考:
# - Plan file §8.3 (α 実装設計、`/Users/yoshi/.claude/plans/task-start-...-functional-planet.md`)
# - Supabase Management API: https://api.supabase.com/api/v1 (advisors/security endpoint)
# - Slack 送信: .github/actions/slack-notify (bot token + chat.postMessage、2026-10 に Incoming Webhook から移行)
# - β (deploy-time check) は deploy-supabase-migrations.yml の Post-deploy advisor check step
#
# 姉妹 workflow: supabase-keepalive.yml (Free plan auto-pause 対策、独立系統)

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) — 週次継続監視
    # keep-alive workflow (00:15 UTC 日次) とは 15 分オフセット、API 集中回避
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (both / staging / production)'
        type: choice
        required: true
        default: both
        options: [both, staging, production]
      force_notify:
        description: 'Force Slack notification even if diff is empty (smoke test / manual verification)'
        type: boolean
        required: false
        default: false

# 同一 env への並列実行を防止。staging と production は別 group で並行可。
concurrency:
  group: supabase-advisor-check-${{ github.event.inputs.target || 'weekly' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # 前回 artifact 取得のため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # API + diff 処理は数秒〜30 秒想定、hang guard
    strategy:
      fail-fast: false  # 片方の env が失敗しても他方は継続 (診断の可用性優先)
      matrix:
        env:
          - name: staging
            project_id_secret: SUPABASE_STG_PROJECT_ID
          - name: production
            project_id_secret: SUPABASE_PROD_PROJECT_ID
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets[matrix.env.project_id_secret] }}
      ENV_NAME: ${{ matrix.env.name }}
      # workflow_dispatch inputs は env: 経由で受け取り、run: 内で直接展開しない
      # (公式 security best practice: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/)。
      # inputs.target は choice 制限 (both/staging/production) / inputs.force_notify は boolean 型で
      # GitHub 側 sanitize されるが、workflow-hardening のため env 経由に統一 (deploy-supabase-migrations.yml と整合)。
      INPUT_TARGET: ${{ github.event.inputs.target || 'both' }}
      INPUT_FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
      # workflow_dispatch で target 指定時、他 env の job は skip
      SKIP_JOB: ${{ github.event.inputs.target != '' && github.event.inputs.target != 'both' && github.event.inputs.target != matrix.env.name }}
    steps:
      - name: Skip job if target does not match
        if: env.SKIP_JOB == 'true'
        run: |
          echo "::notice::Skipping ${ENV_NAME} because workflow_dispatch target=${INPUT_TARGET}"
          # Skip subsequent steps by setting a flag
          echo "SKIP=true" >> "$GITHUB_ENV"

      - name: Validate required secrets
        if: env.SKIP != 'true'
        # deploy-supabase-migrations.yml と整合する早期 fail guard (空文字 secret 検知)。
        # set -u は unset のみ検知し空文字は通してしまうため明示チェック。
        # Slack の token はここでは検査しない (未設定でも advisor のチェックと baseline の
        # 更新は走らせる。送信側の composite action が未設定なら notice で skip する)。
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is empty or unset."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROJECT_REF (from ${{ matrix.env.project_id_secret }}) is empty or unset."
            exit 1
          fi

      - name: Checkout repository
        if: env.SKIP != 'true'
        # actions/checkout v7.0.1 を commit SHA で固定 (deploy-supabase-migrations.yml と整合)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 使うのは composite action と jq のフィルタだけ
          sparse-checkout: |
            .github/actions
            .github/scripts
          persist-credentials: false

      - name: Fetch security advisors from Supabase Management API
        if: env.SKIP != 'true'
        # Supabase Management API 経由で advisors/security を取得。
        # endpoint: GET /v1/projects/{ref}/advisors/security (2026-07 時点 experimental だが安定運用中)
        # response: { "lints": [{ name, title, level, facing, categories[], description, detail, remediation, metadata, cache_key }, ...] }
        # cache_key は lint + 対象オブジェクトの一意 ID として diff key に使う。
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o advisor-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Advisor API failed::HTTP ${HTTP_CODE} for ${ENV_NAME}"
            cat advisor-response.json | head -20
            exit 1
          fi
          # lints が配列でない 200 応答を空の state として保存すると、次回に既存の lint が全件「新規」になる
          if ! jq -e '.lints | type == "array"' advisor-response.json >/dev/null; then
            echo "::error title=Advisor API returned an unexpected shape::lints is not an array for ${ENV_NAME}"
            exit 1
          fi
          # lints 配列を cache_key で ID 化した簡潔形式に整形 (diff 比較用)。
          # claude[bot] PR #256 review Finding #6 採用: shell 変数の埋め込みは --arg
          # に統一 (公式 jq Manual 推奨、同ファイル他所と一貫)。
          # project ref は GitHub で secret 管理している値。public repo の artifact はログインした
          # 誰でもダウンロードできるため state には入れない (diff は lints_by_key しか使わない)
          jq --arg env "${ENV_NAME}" '{
            fetched_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
            env: $env,
            lints_by_key: (.lints | map({key: .cache_key, level, name, title, detail, remediation, categories}) | sort_by(.key) | INDEX(.key)),
            count: (.lints | length)
          }' advisor-response.json > current-state.json
          echo "Current state: $(jq -r '.count' current-state.json) lint(s)"
          jq '.lints_by_key | to_entries | .[] | "- [\(.value.level)] \(.value.name): \(.value.detail)"' -r current-state.json | head -20

      - name: Download previous advisor state artifact
        if: env.SKIP != 'true'
        # 直近の**別の実行**が保存した advisor-state-<env> を baseline として取得する。
        #
        # ⚠️ 以前は actions/download-artifact を run-id 無しで使っていた。その場合は
        #    「同じ実行内」の artifact しか探さないため、週次実行では baseline が毎回見つからず、
        #    差分通知が一度も発火していなかった (2026-09-28 の run log で確認)。
        #    deploy-supabase-migrations.yml の post-deploy チェックと同じく gh api で
        #    名前から最新の artifact を引く (期限切れは除外)。permissions: actions: read が必要。
        # 初回 (artifact が 1 つも無い) / 取得失敗時は previous/ を空のまま次へ進む
        # (Diff step が「baseline 不在」として通知を skip し、今回の state が次の baseline になる)。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p previous
          # fork からの PR は PR 側の workflow 定義で動くため、同じ名前の artifact を置けてしまう。
          # 同じリポジトリの実行が保存したものに限り、production は main の実行に限る
          # (staging は同じリポジトリのどのブランチの実行でもよい。PR ごとの staging deploy が state を残すため)
          FILTER='.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id'
          if [ "${ENV_NAME}" = "production" ]; then
            FILTER="${FILTER} and .workflow_run.head_branch == \"main\""
          fi
          # per_page は上限の 100。少ないと、他ブランチの実行が置いた artifact に押し出されて見つからない
          ARTIFACT_ID=$(gh api "/repos/${GH_REPO}/actions/artifacts?name=advisor-state-${ENV_NAME}&per_page=100" \
            --jq "[.artifacts[] | select(${FILTER})][0].id // empty" 2>/dev/null || true)
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::notice::No unexpired advisor-state-${ENV_NAME} artifact found."
            exit 0
          fi
          if gh api "/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > previous.zip 2>/dev/null \
            && unzip -q -o previous.zip -d previous/ \
            && jq -e '.lints_by_key | type == "object"' previous/current-state.json >/dev/null 2>&1; then
            echo "Baseline: artifact ${ARTIFACT_ID}"
          else
            # 形式が不正な baseline と比べると、既存の lint が全件「新規」扱いになるため使わない
            echo "::warning::Could not use advisor-state-${ENV_NAME} (artifact ${ARTIFACT_ID}). Treating the baseline as missing."
            rm -rf previous && mkdir -p previous
          fi

      - name: Diff current vs previous state
        if: env.SKIP != 'true'
        # cache_key ベースで新規発生 / 解消 lint を検知。差分なしなら通知 skip (noise 回避)。
        # force_notify=true 時は差分ゼロでも「現状 N 件」通知を送る (smoke test 用途)。
        run: |
          set -euo pipefail

          # claude[bot] PR #256 2nd-round review Finding #1 採用: baseline 不在時 (first run /
          # artifact expired) は `comm -23 current empty` が current の全 keys を new-keys.txt に
          # 入れてしまい、SKIP_NOTIFY が発火せず全 current lint を "🆕 New" として Slack に flood
          # する bug があった。BASELINE_FOUND flag を SKIP_NOTIFY 条件に統合し、β 側 (
          # `[ -z "${ARTIFACT_ID}" ]` の early exit) と一貫させる。
          if [ -f ./previous/current-state.json ]; then
            cp ./previous/current-state.json previous-state.json
            PREV_COUNT=$(jq -r '.count' previous-state.json)
            echo "Previous state found: ${PREV_COUNT} lint(s)"
            BASELINE_FOUND=true
          else
            echo '{"lints_by_key": {}, "count": 0}' > previous-state.json
            echo "::notice::No previous state found (first run or artifact expired). Treating all current lints as pre-existing (no diff notification)."
            BASELINE_FOUND=false
          fi

          # cache_key を配列に抽出
          jq -r '.lints_by_key | keys[]' current-state.json | sort > current-keys.txt
          jq -r '.lints_by_key | keys[]' previous-state.json | sort > previous-keys.txt

          # 新規発生: current にあって previous にないもの
          comm -23 current-keys.txt previous-keys.txt > new-keys.txt
          # 解消: previous にあって current にないもの
          comm -13 current-keys.txt previous-keys.txt > resolved-keys.txt

          NEW_COUNT=$(wc -l < new-keys.txt | tr -d ' ')
          RESOLVED_COUNT=$(wc -l < resolved-keys.txt | tr -d ' ')
          echo "Diff: +${NEW_COUNT} new, -${RESOLVED_COUNT} resolved"

          {
            echo "NEW_COUNT=${NEW_COUNT}"
            echo "RESOLVED_COUNT=${RESOLVED_COUNT}"
            echo "BASELINE_FOUND=${BASELINE_FOUND}"
            # 要対応 = baseline があり、新しい lint が増えた。送り先・メンション・baseline の保存条件はこの値だけを見る
            if [ "${NEW_COUNT}" != "0" ] && [ "${BASELINE_FOUND}" = "true" ]; then
              echo "ACTIONABLE=true"
            else
              echo "ACTIONABLE=false"
            fi
          } >> "$GITHUB_ENV"

          # 新規発生 lint の詳細を JSON 化 (Slack payload 用)
          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' new-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            current-state.json > new-lints.json

          # 解消 lint の詳細
          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' resolved-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            previous-state.json > resolved-lints.json

          # 通知 skip 条件 (2 巡目 review Finding #1 対応で BASELINE_FOUND を追加):
          #   (A) baseline 不在 (first run / artifact expired) → 差分は意味を持たないため skip
          #   (B) baseline 存在 かつ 差分ゼロ → noise 回避で skip
          #   INPUT_FORCE_NOTIFY=true 時はいずれも上書きで通知 (smoke test 用途)
          if [ "${INPUT_FORCE_NOTIFY}" = "true" ]; then
            echo "SKIP_NOTIFY=false" >> "$GITHUB_ENV"
            echo "::notice::force_notify=true, sending notification regardless of diff / baseline state."
          elif [ "${BASELINE_FOUND}" = "false" ]; then
            echo "SKIP_NOTIFY=true" >> "$GITHUB_ENV"
            echo "::notice::Baseline not found on ${ENV_NAME}. Skipping Slack notification (baseline being established silently, first-run design)."
          elif [ "${NEW_COUNT}" = "0" ] && [ "${RESOLVED_COUNT}" = "0" ]; then
            echo "SKIP_NOTIFY=true" >> "$GITHUB_ENV"
            echo "::notice::No advisor diff detected on ${ENV_NAME}. Skipping Slack notification (noise 回避)."
          else
            echo "SKIP_NOTIFY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Slack blocks
        id: blocks
        if: env.SKIP != 'true' && env.SKIP_NOTIFY != 'true'
        # lint の section 組み立て (Supabase API 由来の値のエスケープ込み) は
        # post-deploy チェックと共通の jq フィルタを使う。最大 5 件ずつ表示し、超過分は件数だけ出す。
        run: |
          set -euo pipefail

          CURRENT_COUNT=$(jq -r '.count' current-state.json)
          HAS_ERROR=$(jq -r '[.lints_by_key[] | select(.level == "ERROR")] | length > 0' current-state.json)
          if [ "${HAS_ERROR}" = "true" ]; then
            EMOJI="🔴"
          elif [ "${CURRENT_COUNT}" -gt 0 ]; then
            EMOJI="⚠️"
          else
            EMOJI="✅"
          fi
          {
            echo "emoji=${EMOJI}"
            echo "current_count=${CURRENT_COUNT}"
          } >> "$GITHUB_OUTPUT"

          SECTIONS_JQ=.github/scripts/supabase/advisor-lint-sections.jq
          jq --arg label "🆕 新規" --argjson max 5 --argjson remediation true \
            -f "${SECTIONS_JQ}" new-lints.json > new-sections.json
          jq --arg label "✅ 解消" --argjson max 5 --argjson remediation false \
            -f "${SECTIONS_JQ}" resolved-lints.json > resolved-sections.json

          OVERFLOW=""
          if [ "${NEW_COUNT}" -gt 5 ]; then
            OVERFLOW="_…新規ほか $((NEW_COUNT - 5)) 件_ "
          fi
          if [ "${RESOLVED_COUNT}" -gt 5 ]; then
            OVERFLOW="${OVERFLOW}_…解消ほか $((RESOLVED_COUNT - 5)) 件_"
          fi

          jq -n \
            --slurpfile new new-sections.json \
            --slurpfile resolved resolved-sections.json \
            --arg overflow "${OVERFLOW}" '
            $new[0]
            + (if ($new[0] | length > 0) and ($resolved[0] | length > 0) then [{ type: "divider" }] else [] end)
            + $resolved[0]
            + (if $overflow != "" then [{ type: "context", elements: [{ type: "mrkdwn", text: $overflow }] }] else [] end)
            ' > advisor-blocks.json

      - name: Notify Slack
        id: notify
        if: env.SKIP != 'true' && env.SKIP_NOTIFY != 'true'
        # 新規 lint (baseline あり) = 要対応なので、staging の分も本番系へメンション付きで送る。
        # 解消だけの時、baseline が無い時 (force_notify の初回で全件が「新規」に見える時) は
        # 対応不要なので開発系へメンションなしで送る。
        # project ref は GitHub で secret 管理しているため Slack には載せない
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: "${{ env.ACTIONABLE == 'true' && vars.SLACK_CHANNEL_PROD || vars.SLACK_CHANNEL_DEV }}"
          test-channel: ${{ vars.SLACK_CHANNEL_DEV }}
          mention: "${{ env.ACTIONABLE == 'true' && vars.SLACK_MENTION_USER_ID || '' }}"
          text: "${{ steps.blocks.outputs.emoji }} Supabase Advisor (${{ matrix.env.name }}): 新規 ${{ env.NEW_COUNT }} 件 / 解消 ${{ env.RESOLVED_COUNT }} 件 (現在 ${{ steps.blocks.outputs.current_count }} 件)"
          body: "${{ format('*Trigger*: {0} · *Commit*: <{1}/{2}/commit/{3}|{4}>', github.event_name, github.server_url, github.repository, github.sha, github.sha) }}"
          blocks-file: advisor-blocks.json

      - name: Upload current state as artifact (for next run diff)
        # ⚠️ 新規 lint があったのに通知が届かなかった時 (失敗・token 未設定) は保存しない。
        #    保存すると次回はその lint が baseline に入り、二度と通知されなくなるため。
        #    main 以外の ref からの dispatch (テストモード) でも保存しない (テストで baseline を動かさない)
        if: >-
          env.SKIP != 'true'
          && !(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
          && (env.ACTIONABLE != 'true' || steps.notify.outputs.ok == 'true')
        # 次回実行時に previous として download するため保存。overwrite=true で同名 artifact を更新。
        # retention 30 日 = 週次 cron を 4 回 miss しても復旧可能。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advisor-state-${{ matrix.env.name }}
          path: current-state.json
          retention-days: 30
          overwrite: true
