name: Supabase Advisor Check

# Backlog D (α): Supabase Weekly Security 警告メールの受動的な仕組みを、
# 能動的な GitHub Actions cron + Slack Block Kit 通知経路に置き換える。
#
# 起因: PR #251 (venues master + PostGIS) マージ後の Supabase Advisor 週次警告メールを
# BOSS が Gmail 手動 check で受け取って初めて気付いた問題 (PR #251 副産物 = PostGIS
# extension が public schema にインストール → spatial_ref_sys ERROR + 8 件 WARN 発生) を根本解消。
#
# 動作:
# 1. Supabase Management API `GET /v1/projects/{ref}/advisors/security` で
#    staging + production 両プロジェクトの security lints を取得
# 2. 前回実行結果 (Actions artifact `advisor-state-{env}`) と cache_key で diff 検知
# 3. 新規発生 lint / 解消 lint あれば Slack Block Kit で通知 (差分ゼロ時は noise 回避)
# 4. 現在の状態を artifact として保存 (次回実行の diff 元)
#
# 参考:
# - Plan file §8.3 (α 実装設計、`/Users/yoshi/.claude/plans/task-start-...-functional-planet.md`)
# - Supabase Management API: https://api.supabase.com/api/v1 (advisors/security endpoint)
# - Slack Incoming Webhook + Block Kit: https://api.slack.com/messaging/webhooks
# - β (deploy-time check) は deploy-supabase-migrations.yml の Post-deploy advisor check step
#
# 姉妹 workflow: supabase-keepalive.yml (Free plan auto-pause 対策、独立系統)

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) — 週次継続監視
    # keep-alive workflow (00:15 UTC 日次) とは 15 分オフセット、API 集中回避
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (both / staging / production)'
        type: choice
        required: true
        default: both
        options: [both, staging, production]
      force_notify:
        description: 'Force Slack notification even if diff is empty (smoke test / manual verification)'
        type: boolean
        required: false
        default: false

# 同一 env への並列実行を防止。staging と production は別 group で並行可。
concurrency:
  group: supabase-advisor-check-${{ github.event.inputs.target || 'weekly' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # 前回 artifact 取得のため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # API + diff 処理は数秒〜30 秒想定、hang guard
    strategy:
      fail-fast: false  # 片方の env が失敗しても他方は継続 (診断の可用性優先)
      matrix:
        env:
          - name: staging
            project_id_secret: SUPABASE_STG_PROJECT_ID
          - name: production
            project_id_secret: SUPABASE_PROD_PROJECT_ID
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets[matrix.env.project_id_secret] }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SUPABASE_ADVISOR }}
      ENV_NAME: ${{ matrix.env.name }}
      # workflow_dispatch inputs は env: 経由で受け取り、run: 内で直接展開しない
      # (公式 security best practice: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/)。
      # inputs.target は choice 制限 (both/staging/production) / inputs.force_notify は boolean 型で
      # GitHub 側 sanitize されるが、workflow-hardening のため env 経由に統一 (deploy-supabase-migrations.yml と整合)。
      INPUT_TARGET: ${{ github.event.inputs.target || 'both' }}
      INPUT_FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
      # workflow_dispatch で target 指定時、他 env の job は skip
      SKIP_JOB: ${{ github.event.inputs.target != '' && github.event.inputs.target != 'both' && github.event.inputs.target != matrix.env.name }}
    steps:
      - name: Skip job if target does not match
        if: env.SKIP_JOB == 'true'
        run: |
          echo "::notice::Skipping ${ENV_NAME} because workflow_dispatch target=${INPUT_TARGET}"
          # Skip subsequent steps by setting a flag
          echo "SKIP=true" >> "$GITHUB_ENV"

      - name: Validate required secrets
        if: env.SKIP != 'true'
        # deploy-supabase-migrations.yml と整合する早期 fail guard (空文字 secret 検知)。
        # set -u は unset のみ検知し空文字は通してしまうため明示チェック。
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is empty or unset."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_PROJECT_REF (from ${{ matrix.env.project_id_secret }}) is empty or unset."
            exit 1
          fi
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error title=Missing secret::SLACK_WEBHOOK_SUPABASE_ADVISOR is empty or unset."
            exit 1
          fi

      - name: Checkout repository
        if: env.SKIP != 'true'
        # actions/checkout@v5 (deploy-supabase-migrations.yml と整合)
        uses: actions/checkout@v5

      - name: Fetch security advisors from Supabase Management API
        if: env.SKIP != 'true'
        # Supabase Management API 経由で advisors/security を取得。
        # endpoint: GET /v1/projects/{ref}/advisors/security (2026-07 時点 experimental だが安定運用中)
        # response: { "lints": [{ name, title, level, facing, categories[], description, detail, remediation, metadata, cache_key }, ...] }
        # cache_key は lint + 対象オブジェクトの一意 ID として diff key に使う。
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o advisor-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Advisor API failed::HTTP ${HTTP_CODE} for ${ENV_NAME}"
            cat advisor-response.json | head -20
            exit 1
          fi
          # lints 配列を cache_key で ID 化した簡潔形式に整形 (diff 比較用)。
          # claude[bot] PR #256 review Finding #6 採用: shell 変数の埋め込みは --arg
          # に統一 (公式 jq Manual 推奨、同ファイル他所と一貫)。
          jq --arg env "${ENV_NAME}" --arg project_ref "${SUPABASE_PROJECT_REF}" '{
            fetched_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
            env: $env,
            project_ref: $project_ref,
            lints_by_key: (.lints // [] | map({key: .cache_key, level, name, title, detail, remediation, categories}) | sort_by(.key) | INDEX(.key)),
            count: (.lints // [] | length)
          }' advisor-response.json > current-state.json
          echo "Current state: $(jq -r '.count' current-state.json) lint(s)"
          jq '.lints_by_key | to_entries | .[] | "- [\(.value.level)] \(.value.name): \(.value.detail)"' -r current-state.json | head -20

      - name: Download previous advisor state artifact
        if: env.SKIP != 'true'
        # 前回実行時の状態を取得。初回 or artifact 期限切れの場合は not found = 空 state で継続。
        uses: actions/download-artifact@v5
        with:
          name: advisor-state-${{ matrix.env.name }}
          path: ./previous
          # 初回実行時は artifact 不在で warn (fail しない)
          # actions/download-artifact@v5 の default 挙動: 不在時は warn + 空 dir
        continue-on-error: true

      - name: Diff current vs previous state
        if: env.SKIP != 'true'
        # cache_key ベースで新規発生 / 解消 lint を検知。差分なしなら通知 skip (noise 回避)。
        # force_notify=true 時は差分ゼロでも「現状 N 件」通知を送る (smoke test 用途)。
        run: |
          set -euo pipefail

          if [ -f ./previous/current-state.json ]; then
            cp ./previous/current-state.json previous-state.json
            PREV_COUNT=$(jq -r '.count' previous-state.json)
            echo "Previous state found: ${PREV_COUNT} lint(s)"
          else
            echo '{"lints_by_key": {}, "count": 0}' > previous-state.json
            echo "::notice::No previous state found (first run or artifact expired). Treating all current lints as pre-existing (no diff notification)."
          fi

          # cache_key を配列に抽出
          jq -r '.lints_by_key | keys[]' current-state.json | sort > current-keys.txt
          jq -r '.lints_by_key | keys[]' previous-state.json | sort > previous-keys.txt

          # 新規発生: current にあって previous にないもの
          comm -23 current-keys.txt previous-keys.txt > new-keys.txt
          # 解消: previous にあって current にないもの
          comm -13 current-keys.txt previous-keys.txt > resolved-keys.txt

          NEW_COUNT=$(wc -l < new-keys.txt | tr -d ' ')
          RESOLVED_COUNT=$(wc -l < resolved-keys.txt | tr -d ' ')
          echo "Diff: +${NEW_COUNT} new, -${RESOLVED_COUNT} resolved"

          echo "NEW_COUNT=${NEW_COUNT}" >> "$GITHUB_ENV"
          echo "RESOLVED_COUNT=${RESOLVED_COUNT}" >> "$GITHUB_ENV"

          # 新規発生 lint の詳細を JSON 化 (Slack payload 用)
          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' new-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            current-state.json > new-lints.json

          # 解消 lint の詳細
          jq --slurpfile keys <(jq -R -s 'split("\n") | map(select(length > 0))' resolved-keys.txt) \
            '.lints_by_key | to_entries | map(select(.key as $k | $keys[0] | index($k))) | map(.value)' \
            previous-state.json > resolved-lints.json

          # 差分ゼロ + force_notify なし → skip flag
          # INPUT_FORCE_NOTIFY は env 経由で受け取り済 (直接 ${{ }} 展開を避け injection 攻撃面を最小化)
          if [ "${NEW_COUNT}" = "0" ] && [ "${RESOLVED_COUNT}" = "0" ] && [ "${INPUT_FORCE_NOTIFY}" != "true" ]; then
            echo "SKIP_NOTIFY=true" >> "$GITHUB_ENV"
            echo "::notice::No advisor diff detected on ${ENV_NAME}. Skipping Slack notification (noise 回避)."
          else
            echo "SKIP_NOTIFY=false" >> "$GITHUB_ENV"
          fi

      - name: Build and send Slack Block Kit payload
        if: env.SKIP != 'true' && env.SKIP_NOTIFY != 'true'
        # Block Kit で header + section + fields 構成。Slack payload 40KB 上限のため最大 10 lints を表示、
        # 超過分は "…and N more" で丸め。level 別絵文字 (🔴 ERROR / ⚠️ WARN / ℹ️ INFO)。
        run: |
          set -euo pipefail

          CURRENT_COUNT=$(jq -r '.count' current-state.json)
          HAS_ERROR=$(jq -r '[.lints_by_key[] | select(.level == "ERROR")] | length > 0' current-state.json)
          if [ "${HAS_ERROR}" = "true" ]; then
            HEADER_EMOJI="🔴"
            HEADER_TEXT="Supabase Advisor: Active issues on ${ENV_NAME}"
          elif [ "${CURRENT_COUNT}" -gt 0 ]; then
            HEADER_EMOJI="⚠️"
            HEADER_TEXT="Supabase Advisor: Warnings on ${ENV_NAME}"
          else
            HEADER_EMOJI="✅"
            HEADER_TEXT="Supabase Advisor: All clear on ${ENV_NAME}"
          fi

          # 新規発生 lint を Block Kit section に整形 (最大 5 件)。
          # claude[bot] PR #256 review Finding #3 採用: .detail / .remediation が null の場合、
          # jq は `null + "..."` で error を投げ、`set -euo pipefail` により Slack 通知が
          # 完全 skip される。fallback を追加して defensive に (Resolved section と同 pattern)。
          NEW_SECTIONS=$(jq '[
            .[0:5] | .[] |
            {
              type: "section",
              text: {
                type: "mrkdwn",
                text: ("*🆕 New: `\(.name)` (" + .level + ")*\n" + (.detail // "(no detail)") + "\n<" + (.remediation // "https://supabase.com/docs/guides/database/database-linter") + "|Remediation>")
              }
            }
          ]' new-lints.json)

          # 解消 lint を section に整形 (最大 5 件)
          RESOLVED_SECTIONS=$(jq '[
            .[0:5] | .[] |
            {
              type: "section",
              text: {
                type: "mrkdwn",
                text: ("*✅ Resolved: `\(.name)` (" + .level + ")*\n" + (.detail // "(no detail)"))
              }
            }
          ]' resolved-lints.json)

          # 追加情報 (件数 overflow 通知)。
          # claude[bot] PR #256 review Finding #2 採用: bash double-quoted string 内の `\n` は
          # literal 2 文字 (GNU Bash Manual §3.1.2.3)。jq --arg 経由で Slack に渡ると
          # backslash-n がそのまま表示される。ANSI-C quoting `$'\n'` で実 newline 文字 (0x0A)
          # を挿入する。Slack Block Kit mrkdwn は 0x0A を line break として render する。
          NL=$'\n'
          OVERFLOW_TEXT=""
          if [ "${NEW_COUNT}" -gt 5 ]; then
            OVERFLOW_TEXT="${OVERFLOW_TEXT}${NL}_…and $((NEW_COUNT - 5)) more new lint(s)_"
          fi
          if [ "${RESOLVED_COUNT}" -gt 5 ]; then
            OVERFLOW_TEXT="${OVERFLOW_TEXT}${NL}_…and $((RESOLVED_COUNT - 5)) more resolved lint(s)_"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          # Finding #2 採用: summary の \n も実 newline に置換。
          SUMMARY="*Diff*: +${NEW_COUNT} new · −${RESOLVED_COUNT} resolved · Total now: ${CURRENT_COUNT}${NL}*Env*: \`${ENV_NAME}\` (\`${SUPABASE_PROJECT_REF}\`)${NL}*Trigger*: ${{ github.event_name }}${OVERFLOW_TEXT}"

          jq -n \
            --arg header "${HEADER_EMOJI} ${HEADER_TEXT}" \
            --arg summary "${SUMMARY}" \
            --arg run_link "<${RUN_URL}|Workflow run> · <${COMMIT_URL}|Commit>" \
            --argjson new_sections "${NEW_SECTIONS}" \
            --argjson resolved_sections "${RESOLVED_SECTIONS}" \
            '{
              blocks: (
                [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $summary } },
                  { type: "divider" }
                ]
                + $new_sections
                + (if ($new_sections | length > 0) and ($resolved_sections | length > 0) then [{ type: "divider" }] else [] end)
                + $resolved_sections
                + [
                  { type: "divider" },
                  { type: "context", elements: [{ type: "mrkdwn", text: $run_link }] }
                ]
              )
            }' > slack-payload.json

          # Slack Incoming Webhook に POST。Webhook URL は Actions log で自動 masking される。
          HTTP_CODE=$(curl -sS -X POST -o slack-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @slack-payload.json \
            "${SLACK_WEBHOOK_URL}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Slack webhook failed::HTTP ${HTTP_CODE}"
            cat slack-response.txt
            exit 1
          fi
          echo "::notice::Slack notification sent for ${ENV_NAME} (+${NEW_COUNT} / −${RESOLVED_COUNT})"

      - name: Upload current state as artifact (for next run diff)
        if: env.SKIP != 'true'
        # 次回実行時に previous として download するため保存。overwrite=true で同名 artifact を更新。
        # retention 30 日 = 週次 cron を 4 回 miss しても復旧可能。
        uses: actions/upload-artifact@v4
        with:
          name: advisor-state-${{ matrix.env.name }}
          path: current-state.json
          retention-days: 30
          overwrite: true
