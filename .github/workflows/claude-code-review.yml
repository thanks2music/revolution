name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip bot-authored PRs: anthropics/claude-code-action rejects bot actors by default,
    # which causes this workflow to fail noisily on every bot PR (Dependabot / Renovate / etc).
    # Renovate[bot] added 2026-07-06 as part of the Dependabot → Renovate migration (PR #262).
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # claude-code-action は自前の token で認証する。理由は claude.yml の同じ設定を参照
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            This is a public repository, and the owner does not want the site's name or its
            production domain to appear in it. Do not write either of them anywhere in your
            comment, in any language or spelling, even when they appear in the code, the diff,
            alt text, or the PR description. The site name is the default value of
            NEXT_PUBLIC_SITE_NAME in apps/frontend/lib/env.ts, and its English form; write
            {SITE_NAME} instead. Write {DOMAIN} instead of the domain. When you quote code that
            contains them, replace them in the quote the same way.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # --permission-mode default: --allowedTools に無い操作をすべて拒否する。
          #   claude-code-action v1.0.273 (2026-11-12) から既定は auto mode で、許可していない操作も安全審査を通れば動く。
          #   レビューは読むことと投稿することしかしないので、許可リストを厳密にする
          claude_args: |
            --permission-mode default
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Grep,Glob"

