# occurrence 取り込み (S3 = mvp-definition A-4、staging 限定)
#
# 記事マージ → update-mdx-article-index.yml が article-index.json を再生成・commit →
# その main への push を本 workflow が拾い、event_data を staging Supabase へ upsert する。
#
# - 取り込み先は **staging のみ** (2026-08-15 BOSS 確定)。production の
#   service role key / DB password は CI に置かない。規約が実測で固まってから広げる
# - 接続は既存 secrets (SUPABASE_STG_PROJECT_ID / SUPABASE_STG_DB_PASSWORD) から
#   Session Pooler URL を構築する (deploy-supabase-migrations.yml と同方式)。
#   新規 secret の追加は不要
# - 人手キューは Job Summary + artifact (ingest-queue.json) で BOSS が確認する。
#   捌き方: one-more-time/docs/operations/occurrence-ingest-runbook.md (private)
# - Slack: 取り込みが失敗した時と、対応が要る人手キューがある時に、本番系へメンション付きで 1 通送る。
#   dry-run は送らない。main 以外の ref からの dispatch はテストモード (開発系・[TEST]・メンションなし)。
#   振り分けの詳細は .github/scripts/notify/ingest-result-message.sh
name: Ingest Occurrences (staging)

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/lib/mdx/article-index.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (計画とキューの表示のみ、書き込みなし)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ingest-staging
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STG_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STG_PROJECT_ID }}
      # push は実書き込み、workflow_dispatch は dry_run 入力に従う (取り込みと Slack 通知の両方が読む)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging Session Pooler URL
        # deploy-supabase-migrations.yml の構築 step を踏襲 (percent-encode + mask)
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_STG_DB_PASSWORD is empty or unset."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_STG_PROJECT_ID is empty or unset."
            exit 1
          fi
          PASSWORD_ENCODED=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PASSWORD_ENCODED"
          INGEST_DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PASSWORD_ENCODED}@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$INGEST_DATABASE_URL"
          echo "INGEST_DATABASE_URL=$INGEST_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Ingest occurrences
        id: ingest
        working-directory: apps/frontend
        # 通常は 20 秒程度。止まった時に、後の通知 step の時間を job の上限 (10 分) に残す
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            pnpm ingest:occurrences --dry-run
          else
            pnpm ingest:occurrences
          fi

      - name: Upload manual-review queue
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingest-queue-report
          path: apps/frontend/ingest-queue.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build the Slack message
        id: msg
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          QUEUE_ACTIONABLE: ${{ steps.ingest.outputs.queue_actionable }}
          QUEUE_WARNINGS: ${{ steps.ingest.outputs.queue_warnings }}
          QUEUE_BREAKDOWN: ${{ steps.ingest.outputs.queue_breakdown }}
          TARGET: staging
        run: bash .github/scripts/notify/ingest-result-message.sh

      - name: Notify Slack
        if: always() && steps.msg.outputs.notify == 'true'
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_PROD }}
          test-channel: ${{ vars.SLACK_CHANNEL_DEV }}
          mention: ${{ vars.SLACK_MENTION_USER_ID }}
          text: ${{ steps.msg.outputs.text }}
          body: ${{ steps.msg.outputs.body }}
